  const questions = {};
  function q(id,zh,py,th,en,why) { questions[id]={id,...L(zh,py,th,en),why}; }
  q('open','请问您哪里不舒服？','Qǐngwèn nín nǎlǐ bù shūfu?','ไม่สบายตรงไหน เล่าให้ฟังได้ไหมครับ','What is troubling you?','เริ่มด้วยคำถามปลายเปิด ให้ผู้ป่วยเล่าอาการสำคัญโดยไม่ชี้นำ');
  q('duration','这种情况多久了？是突然出现还是慢慢出现的？','Zhè zhǒng qíngkuàng duō jiǔ le? Shì tūrán chūxiàn háishì mànmàn chūxiàn de?','เป็นมานานเท่าไร เริ่มทันทีหรือค่อย ๆ เป็นครับ','How long has this been happening? Was onset sudden or gradual?','ระยะเวลาและรูปแบบการเริ่มป่วยช่วยแยกอาการเฉียบพลันกับเรื้อรัง แต่ไม่ใช้ตัดสินพร่องหรือแกร่งเพียงข้อเดียว');
  q('modifiers','什么情况下会加重或减轻？','Shénme qíngkuàng xià huì jiāzhòng huò jiǎnqīng?','อะไรทำให้อาการมากขึ้นหรือลดลงครับ','What makes it worse or better?','ความสัมพันธ์กับอาหาร อารมณ์ ความเย็น ความอุ่น การออกแรง หรือเวลากลางคืนช่วยแยกกลไกที่คล้ายกัน');
  q('tongue','我想看一下您的舌头，可以吗？','Wǒ xiǎng kàn yíxià nín de shétou, kěyǐ ma?','ขอดูลิ้นได้ไหมครับ','May I examine your tongue?','ลิ้นและฝ้าช่วยประกอบการแยกร้อน เย็น พร่อง ชื้น และเลือดคั่ง ต้องเชื่อมกับประวัติที่ซักมา');
  q('pulse','我想给您把脉，可以吗？','Wǒ xiǎng gěi nín bǎmài, kěyǐ ma?','ขอจับชีพจรได้ไหมครับ','May I take your pulse?','ชีพจรเป็นหลักฐานประกอบสุดท้ายในแบบฝึกนี้ ใช้ยืนยันภาพรวม ไม่ใช้ชีพจรหนึ่งชนิดแทนข้อมูลทั้งหมด');
  q('sleep','是难以入睡、容易醒，还是多梦？','Shì nányǐ rùshuì, róngyì xǐng, háishì duōmèng?','หลับยาก ตื่นง่าย หรือฝันมากครับ','Is it difficulty falling asleep, waking easily, or frequent dreams?','แยกลักษณะการนอนไม่หลับก่อน แล้วค้นอาการร่วมที่ชี้ตำแหน่งและภาวะพร่องหรือแกร่ง');
  q('stool','大便是什么样的？有没有臭味或肛门灼热？','Dàbiàn shì shénme yàng de? Yǒu méiyǒu chòuwèi huò gāngmén zhuórè?','อุจจาระเป็นอย่างไร มีกลิ่นแรงหรือแสบทวารไหมครับ','What are the stools like? Any foul smell or anal burning?','ลักษณะ กลิ่น ความเร่งด่วน และอาการแสบทวารช่วยแยกความชื้นร้อน อาหารสะสม และภาวะพร่อง');
  q('dizzy','头晕时有没有头重、头痛或眼花？','Tóuyūn shí yǒu méiyǒu tóuzhòng, tóutòng huò yǎnhuā?','เวียนหัวร่วมกับหนักหัว ปวดหัว หรือตาพร่าไหมครับ','Does dizziness come with head heaviness, headache, or blurred vision?','หนักศีรษะสัมพันธ์กับเสมหะชื้น ส่วนปวดแน่นหรือหน้าซีดต้องถามต่อเพื่อแยกร้อน หยาง และพร่อง');
  q('sputum','有痰吗？痰的颜色、多少和稀稠怎么样？','Yǒu tán ma? Tán de yánsè, duōshǎo hé xīchóu zěnmeyàng?','มีเสมหะไหม สี ปริมาณ และความข้นเป็นอย่างไรครับ','Is there sputum? What color, amount and consistency?','สี ปริมาณ และความข้นของเสมหะช่วยแยกเย็น ร้อน แห้ง และเสมหะคั่ง ร่วมกับอาการทั่วร่างกาย');
  q('pain','请描述疼痛的位置和性质。','Qǐng miáoshù téngtòng de wèizhi hé xìngzhì.','ช่วยบอกตำแหน่งและลักษณะการปวดครับ','Please describe the location and character of the pain.','ตำแหน่งช่วยกำหนดอวัยวะหรือเส้นลมปราณ ลักษณะปวดแน่น แทง เย็น แสบ หรือตื้อช่วยวางแนว辨证');
  q('sweat','什么时候出汗？睡醒后会停止吗？汗是什么颜色？','Shénme shíhou chūhàn? Shuì xǐng hòu huì tíngzhǐ ma? Hàn shì shénme yánsè?','เหงื่อออกเวลาใด ตื่นแล้วหยุดไหม และสีอะไรครับ','When do you sweat? Does it stop on waking, and what color is it?','ต้องรู้เวลาและลักษณะเหงื่อก่อน การเหงื่อออกกลางคืนหรือคราบเหลืองอย่างเดียวไม่ยืนยัน证型');
  q('palp','心慌是怎样的感觉？发作时还有什么不舒服？','Xīnhuāng shì zěnyàng de gǎnjué? Fāzuò shí hái yǒu shénme bù shūfu?','ใจสั่นรู้สึกอย่างไร ตอนเป็นมีอาการอะไรอีกครับ','What do the palpitations feel like? What else happens during an episode?','อาการร่วมกับใจสั่นช่วยแยกพร่อง เสมหะ เลือดคั่ง และสารน้ำคั่ง ก่อนเชื่อมกับลิ้นและชีพจร');
  q('bloat','胀在什么位置？吃饭以后有什么变化？','Zhàng zài shénme wèizhi? Chīfàn yǐhòu yǒu shénme biànhuà?','อืดตรงไหน หลังอาหารเปลี่ยนอย่างไรครับ','Where is the bloating? How does it change after eating?','ท้องอืดหลังอาหารพบได้ทั้งม้ามพร่องและอาหารสะสม ต้องถามกำลังร่างกาย เรอ และอุจจาระต่อ');
  q('ear','耳鸣是突然发生的吗？声音响不响？听力有变化吗？','Ěrmíng shì tūrán fāshēng de ma? Shēngyīn xiǎng bu xiǎng? Tīnglì yǒu biànhuà ma?','เสียงในหูเริ่มทันทีไหม ดังมากไหม การได้ยินเปลี่ยนไหมครับ','Was tinnitus sudden? How loud is it? Has hearing changed?','เวลาเริ่ม ความดัง และการได้ยินช่วยตั้งแนว แต่ระดับเสียงไม่ใช้ตัดสินสูงต่ำของเสียงหรือ证型เพียงอย่างเดียว');
  q('energy','是没有力气，还是身体沉重？活动后怎样？','Shì méiyǒu lìqi, háishì shēntǐ chénzhòng? Huódòng hòu zěnyàng?','ไม่มีแรงหรือหนักตัว ทำกิจกรรมแล้วเป็นอย่างไรครับ','Is it weakness or body heaviness? What happens after activity?','ความอ่อนแรงกับความหนักตัวช่วยแยกชี่เลือดพร่องและความชื้น โดยยังต้องดูอาหาร อุจจาระ ลิ้น และชีพจร');
  q('appetite','是吃不下，还是吃后胃胀？有没有嗳气、恶心？','Shì chī bu xià, háishì chī hòu wèizhàng? Yǒu méiyǒu ǎiqì, ěxīn?','ไม่อยากอาหารหรือกินแล้วแน่น มีเรอหรือคลื่นไส้ไหมครับ','Is appetite poor, or is there post-meal fullness? Any belching or nausea?','เบื่ออาหารร่วมแน่นหลังอาหารและเรอเหม็นชี้อาหารสะสม ส่วนปากเหนียวหรือชายโครงปวดช่วยแยกชื้นร้อน');
  q('yin','有没有盗汗、手脚心发热或口干？','Yǒu méiyǒu dàohàn, shǒujiǎoxīn fārè huò kǒugān?','มีเหงื่อขณะหลับ ร้อนฝ่ามือฝ่าเท้า หรือปากแห้งไหมครับ','Any sweating during sleep, palm/sole heat, or dry mouth?','ค้นชุดอาการร้อนพร่อง ไม่สรุปจากปากแห้งหรือเหงื่อกลางคืนเพียงอาการเดียว');
  q('qi','有没有乏力、气短、自汗或声音低弱？','Yǒu méiyǒu fálì, qìduǎn, zìhàn huò shēngyīn dīruò?','มีอ่อนเพลีย หายใจสั้น เหงื่อออกเอง หรือเสียงเบาไหมครับ','Any fatigue, shortness of breath, spontaneous sweating, or weak voice?','อ่อนเพลียร่วมกับหายใจสั้น เหงื่อออกเอง และเสียงเบาช่วยสนับสนุนชี่พร่อง');
  q('blood','有没有头晕、面色苍白或心悸？','Yǒu méiyǒu tóuyūn, miànsè cāngbái huò xīnjì?','มีเวียนหัว หน้าซีด หรือใจสั่นไหมครับ','Any dizziness, pallor, or palpitations?','หน้าซีด เวียนหัว และใจสั่นเป็นชุดอาการหล่อเลี้ยงไม่พอ ใช้แยกร่วมกับอาการชี่พร่องและผลตรวจ');
  q('kidney','有没有腰膝酸软、耳鸣或记忆力下降？','Yǒu méiyǒu yāoxī suānruǎn, ěrmíng huò jìyìlì xiàjiàng?','มีเอวเข่าเมื่อยอ่อนแรง เสียงในหู หรือความจำลดลงไหมครับ','Any lower back/knee weakness, tinnitus, or memory decline?','อาการเอวเข่าและหูช่วยชี้ความเกี่ยวข้องกับไต ต้องดูร้อนพร่อง เย็นพร่อง หรือสารจิงพร่องต่อ');
  q('phlegm','有没有胸闷、恶心、痰多或身体困重？','Yǒu méiyǒu xiōngmèn, ěxīn, tán duō huò shēntǐ kùnzhòng?','มีแน่นอก คลื่นไส้ เสมหะมาก หรือหนักตัวไหมครับ','Any chest tightness, nausea, abundant sputum, or body heaviness?','แน่นอก คลื่นไส้ หนักตัว ร่วมฝ้าเหนียวช่วยสนับสนุนเสมหะหรือความชื้น');
  q('fire','有没有口苦、口渴、目赤或口舌生疮？','Yǒu méiyǒu kǒukǔ, kǒukě, mùchì huò kǒushé shēngchuāng?','มีปากขม กระหายน้ำ ตาแดง หรือแผลในปากไหมครับ','Any bitter taste, thirst, red eyes, or mouth ulcers?','ค้นอาการร้อนเด่นและตำแหน่ง เช่น แผลในปากกับปลายลิ้นแดง หรือปากขมตาแดงร่วมชายโครงปวด');
  q('cold','有没有怕冷、手脚冷？热敷后会好些吗？','Yǒu méiyǒu pà lěng, shǒujiǎo lěng? Rèfū hòu huì hǎo xiē ma?','ขี้หนาว มือเท้าเย็นไหม อุ่นแล้วดีขึ้นไหมครับ','Do you feel cold or have cold hands/feet? Does warmth help?','ความหนาวและอุ่นแล้วดีขึ้นสนับสนุนลักษณะเย็น ต้องใช้ความเรื้อรัง กำลัง และชีพจรแยกพร่องเย็นกับเย็นแกร่ง');
  q('food','有没有嗳腐、吞酸、腹胀或大便酸臭？','Yǒu méiyǒu ǎifǔ, tūnsuān, fùzhàng huò dàbiàn suānchòu?','มีเรอเหม็น น้ำเปรี้ยวย้อน ท้องอืด หรืออุจจาระเปรี้ยวเหม็นไหมครับ','Any foul belching, acid regurgitation, bloating, or sour-smelling stools?','ชุดอาหารคั่งต่างจากพร่องตรงเรอเหม็น แน่นมากหลังอาหาร และฝ้าหนาเหนียว');
  q('emotion','和情绪有关系吗？有没有胸胁胀满、嗳气或叹气？','Hé qíngxù yǒu guānxi ma? Yǒu méiyǒu xiōngxié zhàngmǎn, ǎiqì huò tànqì?','สัมพันธ์กับอารมณ์ไหม มีแน่นชายโครง เรอ หรือถอนหายใจไหมครับ','Is it related to emotions? Any flank fullness, belching or sighing?','ความสัมพันธ์กับอารมณ์ร่วมปวดแน่น เรอ และถอนหายใจสนับสนุนชี่ตับติดขัด');
  q('stasis','疼痛像针刺吗？位置固定吗？晚上会加重吗？','Téngtòng xiàng zhēncì ma? Wèizhi gùdìng ma? Wǎnshang huì jiāzhòng ma?','ปวดเหมือนเข็มแทงไหม อยู่จุดเดิมไหม กลางคืนมากขึ้นไหมครับ','Is pain stabbing, fixed in location, or worse at night?','ปวดแทงตำแหน่งเดิมร่วมลิ้นม่วงคล้ำและชีพจรฝืดช่วยชี้เลือดคั่ง');
  q('water','有没有浮肿、小便不利或怕冷？','Yǒu méiyǒu fúzhǒng, xiǎobiàn bù lì huò pà lěng?','มีบวม ปัสสาวะไม่คล่อง หรือขี้หนาวไหมครับ','Any edema, impaired urination, or cold intolerance?','บวมและปัสสาวะผิดปกติเป็นตัวแยกสำคัญของน้ำคั่งรบกวนหัวใจจากกลุ่มใจสั่นอื่น');
  q('dampheat','有没有口苦口黏、身体困重或小便黄？','Yǒu méiyǒu kǒukǔ kǒunián, shēntǐ kùnzhòng huò xiǎobiàn huáng?','ปากขมปากเหนียว หนักตัว หรือปัสสาวะเหลืองไหมครับ','Any bitter sticky mouth, body heaviness or yellow urine?','ชื้นร่วมร้อนต้องมีหลักฐานทั้งความชื้น เช่น หนักตัวฝ้าเหนียว และความร้อน เช่น ขม เหลือง แสบ');
  q('dry','有没有咽干、鼻燥、口干或皮肤干燥？','Yǒu méiyǒu yāngān, bízào, kǒugān huò pífū gānzào?','คอ จมูก ปาก หรือผิวแห้งไหมครับ','Any dryness of throat, nose, mouth or skin?','ไอแห้งร่วมจมูกคอแห้งชี้ความแห้ง ต้องแยกจากหยินพร่องด้วยระยะเวลาและอาการร้อนพร่อง');
  q('genital','疼痛会牵引到腹股沟或阴部吗？遇冷会加重吗？','Téngtòng huì qiānyǐn dào fùgǔgōu huò yīnbù ma? Yù lěng huì jiāzhòng ma?','ปวดร้าวไปขาหนีบหรืออวัยวะเพศไหม เย็นแล้วมากขึ้นไหมครับ','Does pain radiate to the groin/genitals and worsen with cold?','ตำแหน่งท้องน้อยและแนวร้าวร่วมความเย็นช่วยแยกเย็นคั่งในเส้นลมปราณตับ');

ื่องมือวินิจฉัยจริง'}</p></div>

  function begin(id,mode='practice',queue=[id],at=0){state.active=E.newSession(id,mode);state.queue=queue;state.queueAt=at;feedback=null;hintId=null;chartOpen=innerWidth>720;scene?.setPatient(E.getCase(id));persist();navigate('clinic');}
  function launch(groupId=0,mode='practice',count=1,weak=false){let queue=E.randomQueue({groupId,count,weakIds:weak?Object.keys(state.weak):[],seed:Date.now()});if(!weak&&count===1){const fresh=E.catalogue.filter(c=>(!groupId||c.groupId===Number(groupId))&&!state.records[c.id]);if(fresh.length)queue=[fresh[Math.floor(Math.random()*fresh.length)].id];}if(!queue.length){toast('ยังไม่มีเคสในกลุ่มนี้');return;}begin(queue[0],mode,queue);}
  function recordCompletion(){const s=state.active,c=E.getCase(s.caseId),old=state.records[c.id];if(s.recorded)return;state.records[c.id]={best:Math.max(old?.best||0,s.score),runs:(old?.runs||0)+1,stars:Math.max(old?.stars||0,E.stars(s)),last:new Date().toISOString(),errors:s.errors};if(s.errors||s.hints)state.weak[c.patternId]=(state.weak[c.patternId]||0)+s.errors+s.hints;else delete state.weak[c.patternId];s.recorded=true;persist();}
  let audioContext;
  function chime(good){if(!state.settings.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);osc.frequency.setValueAtTime(good?523:220,audioContext.currentTime);osc.frequency.exponentialRampToValueAtTime(good?784:180,audioContext.currentTime+.13);gain.gain.setValueAtTime(.045,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.22);osc.start();osc.stop(audioContext.currentTime+.23);}catch{}}
  function speak(text){if(!('speechSynthesis'in window)){toast('เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน ใช้พินอินแทนได้ครับ');return;}const voices=speechSynthesis.getVoices(),voice=voices.find(v=>/^zh[-_]CN/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));if(!voice){toast('ไม่พบเสียงจีนในอุปกรณ์ เปิดเสียงภาษาจีนในการตั้งค่าของเครื่องก่อนครับ');return;}speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(text);utter.voice=voice;utter.lang=voice.lang;utter.rate=.82;utter.onerror=()=>toast('เสียงจีนยังไม่พร้อม กรุณาใช้พินอินหรือลองอีกครั้ง');speechSynthesis.speak(utter);}
  function openModal(title,body){lastFocus=document.activeElement;$('#modal-content').innerHTML=`<div class="modal-head"><h2 id="modal-title">${escape(title)}</h2><button class="close" data-action="modal-close" aria-label="ปิดหน้าต่าง">×</button></div><div class="modal-body">${body}</div>`;$('#modal').showModal();applySettings();}
  function closeModal(){if($('#modal').open)$('#modal').close();lastFocus?.focus?.();}
  function guide(){openModal('เริ่มเวรแรกของคุณ',`<p class="small muted">เกมนี้ฝึกการถามประวัติและแยกกลุ่มอาการตามรายการที่คุณให้มา</p>${[['เลือกเคสหรือทบทวนก่อน','อ่านอาการสำคัญ จุดแยก ลิ้น และชีพจรในห้องทบทวน สลับพินอินและคำแปลไทยได้ตลอด'],['ซักประวัติทีละเป้าหมาย','เปิดการสนทนา → ระยะเวลา → ลักษณะอาการ → ปัจจัยกระตุ้น → อาการร่วม → ลิ้น → ชีพจร ต้องตอบคำถามให้ถูกในแต่ละขั้นจึงไปต่อ'],['เลือกผิด ยังเรียนต่อได้','เริ่มที่ 100 คะแนน เลือกคำถามไม่ตรงเป้าหมาย −8 วินิจฉัยผิด −15 ขอคำใบ้ −5 คะแนนต่ำสุด 0 ไม่มีเกมโอเวอร์ ต้องเลือกคำตอบถูกก่อนผ่าน'],['เชื่อมหลักฐานก่อนวินิจฉัย','เมื่อเก็บครบ 7 ขั้น เลือก证型 (zhèngxíng) แล้วอ่านเหตุผลและฝึกประโยคตอบอาจารย์ ได้ 3 ดาวเมื่อคะแนน ≥90 และไม่ใช้คำใบ้; 2 ดาวเมื่อ ≥65; นอกนั้น 1 ดาว']].map(([h,p],i)=>`<div class="intro-step"><span class="number">${i+1}</span><div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}<div class="read-note">คำถามอื่นอาจมีประโยชน์ในคลินิกจริง การหักคะแนนในเกมหมายถึง “ไม่ตรงเป้าหมายที่กำหนดในรอบนี้” ไม่ใช่ตัดสินว่าเป็นคำถามที่ผิดทางการแพทย์เสมอไป</div><div class="why-box">${D.meta.note}<br>กลุ่มเหงื่อที่ซ้ำและชื่อ证型คงตามข้อความต้นฉบับ การวินิจฉัยโรคจริงต้องประเมินสาเหตุอื่นและความเร่งด่วนด้วย</div><div class="mt"><a href="${D.meta.terminology}" target="_blank" rel="noopener">WHO: เอกสารอ้างอิงคำศัพท์แพทย์แผนจีน</a><p class="tiny muted">ใช้เป็นแหล่งคำศัพท์เพิ่มเติม ไม่ได้หมายถึงรับรองความถูกต้องหรือประสิทธิผลของเคสในเกม</p></div><button class="btn primary mt" data-action="modal-close" style="width:100%">พร้อมเรียนรู้แล้ว ${icon('arrow')}</button>`);}
  function settings(){openModal('จัดห้องเรียนให้เหมาะกับคุณ',`<div class="settings-list">${[['pinyin','พินอิน','แสดงคำอ่านใต้ข้อความจีน'],['thai','คำแปลไทย','เปิด–ปิดคำแปลของบทเรียน คำถาม และคำตอบ'],['english','English','แสดงคำแปลอังกฤษควบคู่กัน'],['sound','เสียงเอฟเฟกต์','เสียงสั้นเมื่อเลือกคำตอบ'],['motion','แอนิเมชัน 3D','ปิดเพื่อลดการเคลื่อนไหวของตัวละคร']].map(([key,title,desc])=>`<div class="settings-row"><div><strong>${title}</strong><p>${desc}</p></div>${toggle(key,'เปิด / ปิด')}</div>`).join('')}</div><p class="read-note">เสียงอ่านจีนใช้เสียงที่มีในเครื่อง หากไม่พบเสียงจีน เกมจะแจ้งให้ทราบและยังอ่านพินอินได้</p><button class="btn mt" data-action="guide">วิธีเล่นและแหล่งข้อมูล</button>`);}
  function exportProgress(){const payload={app:'jade-clinic',version:1,exportedAt:new Date().toISOString(),records:state.records,weak:state.weak};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jade-clinic-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  async function importProgress(file){try{if(file.size>2e6)throw Error('File too large');const data=JSON.parse(await file.text());if(data.app!=='jade-clinic'||data.version!==1)throw Error('Invalid format');const cleaned=cleanRecords(data.records);for(const [id,r]of Object.entries(cleaned)){const old=state.records[id];if(!old||old.best<r.best)state.records[id]=r;}for(const [id,n]of Object.entries(data.weak||{}))if(Object.hasOwn(D.patterns,id)&&Number.isInteger(n)&&n>0)state.weak[id]=Math.min(10000,Math.max(state.weak[id]||0,n));persist();render();toast('นำเข้าความคืบหน้าแล้วครับ');}catch{toast('นำเข้าไม่ได้ กรุณาเลือกไฟล์ความคืบหน้าจาก Jade Clinic');}}
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id;
    if(a==='toggle'){let k=el.dataset.key;state.settings[k]=!state.settings[k];persist();applySettings();return;}
    if(a==='nav'){navigate(el.dataset.route);return;}
    if(a==='guide'){if($('#modal').open)closeModal();guide();return;}
    if(a==='settings'){settings();return;}
    if(a==='modal-close'){closeModal();return;}
    if(a==='speak'){speak(speechBank[id]);return;}
    if(a==='rotate-left'||a==='rotate-right'){scene?.rotate(a==='rotate-left'?-1:1);return;}
    if(a==='scene-reset'){scene?.setView('room');return;}
    if(a==='start'){launch(0,el.dataset.mode||'practice',Number(el.dataset.count)||1);return;}
    if(a==='group-start'){launch(Number(id));return;}
    if(a==='resume'){restoreRunUI();scene?.setPatient(E.getCase(state.active.caseId));navigate('clinic');return;}
    if(a==='weak-start'){if(!Object.keys(state.weak).length){toast('ยังไม่มีจุดพลาด เริ่มเวรฝึก 1 เคสได้เลยครับ');launch();}else launch(0,'practice',5,true);return;}
    if(a==='study-group'){studyGroup=Number(id);flashIndex=0;flashRevealed=false;render();return;}
    if(a==='study-tab'){studyTab=el.dataset.tab;search='';render();return;}
    if(a==='pattern-detail'){openModal('อาการและเหตุผล',detail(D.patterns[id]));return;}
    if(a==='pattern-start'){const gid=Number(el.dataset.group)||D.groups.find(g=>g.patternIds.includes(id)).id,pool=E.catalogue.filter(c=>c.groupId===gid&&c.patternId===id),fresh=pool.filter(c=>!state.records[c.id]);begin((fresh[0]||pool[Math.floor(Math.random()*pool.length)]).id);return;}
    if(a==='flash-reveal'){flashRevealed=true;render();return;}
    if(a==='flash-next'){flashIndex++;flashRevealed=false;render();return;}
    if(a==='case-start'){begin(id);return;}
    if(a==='start-filtered'){const pool=filteredCases();if(pool.length)begin(pool[Math.floor(Math.random()*pool.length)].id);else toast('ไม่มีเคสตรงตัวกรองนี้');return;}
    if(a==='page'){casePage+=Number(el.dataset.dir);render({scroll:true});return;}
    if(a==='chart-toggle'){chartOpen=!chartOpen;render();return;}
    if(a==='question'){const r=E.chooseQuestion(state.active,id);if(r.blocked)return;feedback=r;chime(r.ok);scene?.setMood(r.ok?'happy':'wrong');if(r.ok&&E.getStep(state.active).id==='tongue')scene?.setView('tongue');if(r.ok&&E.getStep(state.active).id==='pulse')scene?.setView('pulse');persist();render();requestAnimationFrame(()=>$('.feedback')?.scrollIntoView({block:'nearest',behavior:state.settings.motion?'smooth':'instant'}));return;}
    if(a==='next'){if(!E.advance(state.active))return;feedback=null;hintId=null;scene?.setView('room');persist();render();requestAnimationFrame(()=>{$('#question-title')?.focus({preventScroll:true});if(innerWidth<721)$('.question-panel')?.scrollIntoView({block:'start',behavior:state.settings.motion?'smooth':'instant'});});return;}
    if(a==='hint'){const id=E.hint(state.active);if(id){hintId=id;persist();render();toast('ขอบสีทองคือคำถามหรือกลุ่มอาการที่แนะนำ ลองเชื่อมกับหลักฐานดูครับ');}return;}
    if(a==='diagnose'){const r=E.diagnose(state.active,id);if(r.blocked)return;feedback=r;chime(r.ok);scene?.setMood(r.ok?'happy':'wrong');if(r.ok){recordCompletion();render({scroll:true});}else{persist();render();requestAnimationFrame(()=>$('.feedback')?.scrollIntoView({block:'nearest',behavior:state.settings.motion?'smooth':'instant'}));}return;}
    if(a==='queue-next'){const i=state.queueAt+1;if(i<state.queue.length)begin(state.queue[i],state.active.mode,state.queue,i);return;}
    if(a==='replay'){begin(state.active.caseId,state.active.mode,state.queue,state.queueAt);return;}
    if(a==='study-this'){studyGroup=E.getCase(state.active.caseId).groupId;studyTab='read';navigate('study');return;}
    if(a==='export'){exportProgress();return;}
  });
  document.addEventListener('change',e=>{const el=e.target,a=el.dataset.change;if(el.id==='import-progress'&&el.files[0]){importProgress(el.files[0]);return;}if(!a)return;if(a==='case-group'){caseGroup=Number(el.value);casePage=0;}else if(a==='case-filter'){caseFilter=el.value;casePage=0;}else if(a==='compare-a')compareA=el.value;else if(a==='compare-b')compareB=el.value;render();});
  document.addEventListener('input',e=>{if(e.target.id!=='search')return;const value=e.target.value,pos=e.target.selectionStart;search=value;casePage=0;render();$('#search')?.focus({preventScroll:true});$('#search')?.setSelectionRange(pos,pos);});
  $('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  $('#modal').addEventListener('cancel',()=>lastFocus?.focus?.());
  window.addEventListener('hashchange',()=>{const next=location.hash.slice(2);if(next!==route){route=['home','study','cases','progress','clinic'].includes(next)?next:'home';if(route==='clinic'&&!state.active)route='home';render({scroll:true});}});
  window.addEventListener('pagehide',()=>{persist();window.speechSynthesis?.cancel();});
  $('#scene-root').addEventListener('scene-unavailable',()=>{if(scene)scene.active=false;$('#scene-fallback').hidden=false;});
  shell();render();
  try{scene=new window.Clinic3D($('#clinic-canvas'));scene.setMotion(state.settings.motion);if(state.active)scene.setPatient(E.getCase(state.active.caseId));}catch(error){$('#scene-fallback').hidden=false;console.warn('3D fallback:',error.message);}
  window.addEventListener('resize',()=>scene?.resize());
  if(memoryOnly)toast('ความคืบหน้าจะอยู่ในรอบนี้ ส่งออกจากหน้าพัฒนาการเพื่อเก็บไว้ได้ครับ');
})();
</script>
